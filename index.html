<style>
/* Layout: cabine de estádio à noite. Barra do jogador fixa no topo, abas por área, painéis em grade. */
:root{
  --bg:#0b0c0a;--ink:#f3f5ee;--mute:#8d9185;--panel:#161815;--panel2:#1f221c;--line:#262a22;
  --amber:#c8f31d;--grass:#7bd34a;--red:#ff6b6b;--blue:#4aa3ff;--violet:#b26bff;--gold:#ffc933;
  --f-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,sans-serif;--f-num:'Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  }
#app{max-width:1060px;margin:0 auto}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:900;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.02}
h1{font-size:clamp(44px,9vw,92px)}h2{font-size:30px}h3{font-size:20px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel.hi{background:var(--panel2)}
button{font:600 14px var(--f-body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:40px}
button:hover:not(:disabled){border-color:var(--mute)}button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--amber);color:#1a1300;border-color:var(--amber);font-weight:700}
button.pri:hover:not(:disabled){filter:brightness(1.08)}
button.dan{border-color:var(--red);color:#ff9a9d}
button.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{font:500 15px var(--f-body);color:var(--ink);background:#0d1611;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
textarea{min-height:120px;font:12px/1.3 monospace}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:10px 0 6px;margin:0}
.nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.nav button{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--mute);white-space:nowrap;padding:8px 12px}
.nav button.on{color:var(--ink);border-bottom-color:var(--amber)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font:600 12px var(--f-num);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--mute)}
.r-comum{--rc:#8ea196}.r-raro{--rc:var(--blue)}.r-epico{--rc:var(--violet)}.r-lendario{--rc:var(--gold)}
.tcard{border:2px solid var(--rc,var(--line));border-radius:12px;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 22%,var(--panel)),var(--panel) 70%);min-width:0}
.tcard .rar{color:var(--rc);font:600 12px var(--f-num);letter-spacing:.14em;text-transform:uppercase}
.tcard .nm{font:900 26px var(--f-display);text-transform:uppercase;line-height:1}
.r-lendario.tcard{box-shadow:0 0 30px -6px var(--gold)}
.spin{animation:spin .09s steps(1) infinite}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.bar{height:8px;background:#0d1611;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--grass)}
.attr{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center}
.ovr{font:900 54px/1 var(--f-display);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font:600 11px var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
tr.me td{background:color-mix(in srgb,var(--amber) 14%,transparent);font-weight:600}
.tw{overflow-x:auto}
#toasts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:30;width:min(340px,calc(100vw - 24px))}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:10px 12px;animation:slidein .3s;font-size:14px}
.toast.g{border-left-color:var(--grass)}.toast.b{border-left-color:var(--red)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(3,8,5,.82);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 40px}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(640px,100%);animation:pop .3s}
.goal{font:900 clamp(60px,18vw,150px)/1 var(--f-display);color:var(--amber);text-align:center;text-transform:uppercase;animation:pop .6s}
.score{font:900 56px/1 var(--f-display);text-align:center}
.crest{flex:none;display:block}
.hero{padding:40px 0 20px}
.log p{margin:0 0 6px;padding-left:10px;border-left:2px solid var(--line)}
.pos{color:var(--grass)}.neg{color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.opt{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt button{padding:14px 10px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:520px){.attr{grid-template-columns:78px 1fr 30px}h2{font-size:26px}}

/* ===== redesign ===== */
:root{--teal:#c8f31d}
.panel{background:linear-gradient(180deg,var(--panel),#0f1914);border-radius:14px;box-shadow:0 10px 26px -20px #000}
button{transition:transform .15s,border-color .15s,filter .15s,background .2s}button:active:not(:disabled){transform:scale(.97)}
.play{background:linear-gradient(180deg,#ffc933,#ffa200);color:#1a1300;border:0;font:800 16px var(--f-body);padding:14px 18px;border-radius:12px;box-shadow:0 8px 20px -8px rgba(255,170,0,.7);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.play:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.train{background:linear-gradient(180deg,#25c7b5,#139b8c);color:#031a17;border:0;font-weight:700;border-radius:10px}.train:hover:not(:disabled){filter:brightness(1.08)}.train:disabled{opacity:.55}
.ghost{background:transparent}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar>i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.nav button{display:inline-flex;gap:6px;align-items:center}.ico{flex:none}
.top .bar-top{flex-wrap:nowrap;gap:10px}.nm1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ovrbox{text-align:right}.ovrbox .ovr{font-size:38px}
.banner{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--club) 62%,#0b120e) 0%,#0b120e 88%);border:1px solid color-mix(in srgb,var(--club) 45%,var(--line));animation:rise .5s both}
.bn-crest{position:absolute;right:-18px;top:-14px;opacity:.2;transform:rotate(10deg);pointer-events:none}.bn-stats{margin-top:14px;gap:24px;position:relative}
.seg{display:flex;gap:4px;background:#0d1611;border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;background:transparent;border:0;border-radius:9px;color:var(--mute);display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--amber)}.seg.big .s-train.on{box-shadow:inset 0 -2px 0 var(--teal)}.seg.big button{min-height:44px}
.view.anim>*{animation:rise .35s both}.view.anim>*:nth-child(2){animation-delay:.05s}.view.anim>*:nth-child(3){animation-delay:.1s}.view.anim>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.match .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.tm{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}.tm b{overflow-wrap:anywhere}
.vsm{display:flex;flex-direction:column;align-items:center;text-align:center}.vsm .disp{font-size:30px;color:var(--mute)}
.stad{border-radius:10px;overflow:hidden;max-height:110px;opacity:.92}
.cta{display:grid;gap:8px;grid-template-columns:1fr 1fr}.cta .play{grid-column:1/-1}

const R=Math.random,ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],cl=(x,a,b)=>Math.max(a,Math.min(b,x));

const wpick=(arr,wf)=>{const t=arr.reduce((s,x)=>s+wf(x),0);let r=R()*t;for(const x of arr){r-=wf(x);if(r<=0)return x}return arr[arr.length-1]};

function rrSchedule(ids,legs){let t=shuffle(ids.slice());if(t.length%2)t.push(null);const n=t.length,rd=[];
 for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)m.push(r%2?[b,a]:[a,b])}rd.push(m);t.splice(1,0,t.pop())}
 if(legs===2)rd.push(...rd.map(x=>x.map(([a,b])=>[b,a])));return rd}
function mkLeague(key,name,ids,legs,off,neutral){const t={};ids.forEach(i=>t[i]={id:i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
 return{type:'league',key,name,ids,sched:rrSchedule(ids,legs),r:0,t,off:off||0,neutral:!!neutral,done:false}}
function mkKO(key,name,ids,neutral,pairs){return{type:'ko',key,name,alive:ids.slice(),r:0,pairs:pairs||null,hist:[],neutral:!!neutral,champ:null,off:0}}
function mkGKO(key,name,ids,gs,legs,neutral){const sh=shuffle(ids.slice()),groups=[];
 for(let i=0;i<sh.length;i+=gs)groups.push(mkLeague(key+'g'+groups.length,'Grupo '+'ABCDEFGH'[groups.length],sh.slice(i,i+gs),legs,0,neutral));
 return{type:'gko',key,name,groups,stage:'g',gr:0,ko:null,neutral:!!neutral,off:0}}
const KON={2:'Final',4:'Semifinal',8:'Quartas de final',16:'Oitavas de final',32:'16-avos de final'};
const sortT=t=>Object.values(t).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||(R()-.5));
function simAI(a,b,sf,neutral){const d=(sf(a)-sf(b))/34,h=neutral?0:.1;return[poisson(1.3*Math.exp(d+h)),poisson(1.3*Math.exp(-d-h))]}
function addRes(t,h,a,gh,ga){const H=t[h],A=t[a];H.p++;A.p++;H.gf+=gh;H.ga+=ga;A.gf+=ga;A.ga+=gh;
 if(gh>ga){H.w++;A.l++;H.pts+=3}else if(gh<ga){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}}
function lgRound(c,mine){const sf=sfOf(c);for(const[h,a]of c.sched[c.r]){let gh,ga;if(mine&&mine.h===h&&mine.a===a){gh=mine.gh;ga=mine.ga}else[gh,ga]=simAI(h,a,sf,c.neutral);addRes(c.t,h,a,gh,ga)}
 c.r++;if(c.r>=c.sched.length)c.done=true}
function koDraw(c){if(!c.pairs){const a=shuffle(c.alive.slice());c.pairs=[];for(let i=0;i<a.length;i+=2)c.pairs.push([a[i],a[i+1]])}}
function koRound(c,mine){koDraw(c);const sf=sfOf(c),w=[],rec=[];
 for(const[a,b]of c.pairs){let ga,gb,pen=null,isMine=mine&&mine.h===a&&mine.a===b;if(isMine){ga=mine.gh;gb=mine.ga}else[ga,gb]=simAI(a,b,sf,c.neutral);
  let win;if(ga>gb)win=a;else if(gb>ga)win=b;else{const sw=R()<cl(.5+(sf(a)-sf(b))/150,.3,.7),x=ri(3,5),y=Math.max(0,x-1-(R()<.25?1:0));pen=sw?[x,y]:[y,x];win=sw?a:b}
  rec.push([a,b,ga,gb,pen,win]);w.push(win);if(isMine){mine.pen=pen;mine.win=win}}
 c.hist.push({n:KON[c.alive.length]||'Rodada',m:rec});c.alive=w;c.r++;c.pairs=null;if(w.length===1)c.champ=w[0]}
function gkoRound(c,mine){
 if(c.stage==='g'){for(const g of c.groups)lgRound(g,mine&&g.ids.includes(mine.h)?mine:null);c.gr++;
  if(c.groups[0].done){const W=[],Rr=[];for(const g of c.groups){const s=sortT(g.t);W.push(s[0].id);Rr.push(s[1].id)}
   const pairs=[],G2=c.groups.length;for(let i=0;i<G2;i+=2)pairs.push([W[i],Rr[i+1]]);for(let i=0;i<G2;i+=2)pairs.push([W[i+1],Rr[i]]);
   c.ko=mkKO(c.key+'k',c.name,[...W,...Rr],c.neutral,pairs);c.stage='k'}}
 else koRound(c.ko,mine)}
function compNext(c,me){
 if(c.type==='league'){const m=c.sched[c.r]&&c.sched[c.r].find(p=>p.includes(me));return m?{h:m[0],a:m[1],stage:(c.name.startsWith('Grupo')?'':'Rodada '+(c.r+1)+' de '+c.sched.length)}:null}
 if(c.type==='ko'){if(c.champ||!c.alive.includes(me))return null;koDraw(c);const m=c.pairs.find(p=>p.includes(me));return m?{h:m[0],a:m[1],stage:KON[c.alive.length]||'Mata-mata',ko:true}:null}
 if(c.stage==='g'){const g=c.groups.find(x=>x.ids.includes(me));if(!g)return null;const m=compNext(g,me);return m?{...m,stage:g.name+' · jogo '+(c.gr+1)+' de '+g.sched.length}:null}
 return c.ko?compNext(c.ko,me):null}
function compRound(c,mine){if(c.type==='league')lgRound(c,mine);else if(c.type==='ko')koRound(c,mine);else gkoRound(c,mine)}
function compDone(c){return c.type==='league'?c.done:c.type==='ko'?!!c.champ:!!(c.ko&&c.ko.champ)}
function compChamp(c){return c.type==='league'?(c.done?sortT(c.t)[0].id:null):c.type==='ko'?c.champ:(c.ko&&c.ko.champ)}
function compResult(c,me){ // {txt, champ, pos}
 if(c.type==='league'){const s=sortT(c.t),pos=s.findIndex(x=>x.id===me)+1;return{pos,champ:pos===1,txt:pos+'º lugar'}}
 if(c.type==='ko'){if(c.champ===me)return{champ:true,txt:'Campeão'};let last=null;for(const h of c.hist)if(h.m.some(x=>x[0]===me||x[1]===me))last=h.n;return{champ:false,txt:last?'Eliminado: '+last:'Não participou'}}
 const g=c.groups.find(x=>x.ids.includes(me));if(!g)return{champ:false,txt:'Não participou'};
 if(!c.ko||!c.ko.hist.length&&!c.ko.alive.includes(me)&&c.stage==='g'){return{champ:false,txt:'Eliminado na fase de grupos'}}
 if(c.ko&&!c.ko.alive.includes(me)&&!c.ko.hist.some(h=>h.m.some(x=>x[0]===me||x[1]===me)))return{champ:false,txt:'Eliminado na fase de grupos'}
 return compResult(c.ko,me)}

 const d=(sm-x.so)/34;let gm=poisson(1.3*Math.exp(d+.1*x.home)),go=poisson(1.3*Math.exp(-d-.1*x.home));

 if(min>0){const pG=cl(1.1*w.g*Math.exp((ovr-80)/25)*f*Math.exp(.35*z),0,.8),pA=cl(1.05*w.a*Math.exp((ovr-80)/30)*f*Math.exp(.3*z)*(.6+P.attrs.pas/150),0,.7);
  for(let i=0;i<gm;i++){if(R()<pG)pg++;else if(R()<pA)pa++}}
 let rt=6.25+.35*z+.8*pg+.5*pa+(gm>go?.25:gm<go?-.2:0)+gauss()*.35;
 if(['GK','ZAG','LAT','VOL'].includes(P.pos)){if(go===0)rt+=.5;else if(go>=2)rt-=.3*(go-1)}
 if(min<30)rt=6+(rt-6)*.5;rt=cl(Math.round(rt*10)/10,3.5,10);
 if(min===0)rt=0;

  let j=null;const t=await r.text();if(t){try{j=JSON.parse(t)}catch(e){j=t}}

  return j}
 catch(e){if(e.name==='AbortError'){const er=new Error('Tempo esgotado ao falar com o servidor.');er.net=true;throw er}
  if(e instanceof TypeError){const er=new Error('Sem conexão com o servidor.');er.net=true;throw er}throw e}
 finally{clearTimeout(to)}}

let CRESTS={};try{CRESTS=JSON.parse(localStorage.getItem('cc-crests')||'{}')||{}}catch(e){CRESTS={}}
function saveCrests(){try{localStorage.setItem('cc-crests',JSON.stringify(CRESTS));return true}catch(e){return false}}
let _cu=0;
function crest(id,sz){sz=sz||40;const c=CLUBS[id];
 if(CRESTS[id])return`<img class="crest" width="${sz}" height="${sz}" src="${CRESTS[id]}" alt="${esc(c?c.n:id)}" style="object-fit:contain">`;
 if(!c){const n=NATS[id];return`<svg class="crest" width="${sz}" height="${sz}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#18271f" stroke="#3a5546" stroke-width="2"/><text x="20" y="25" text-anchor="middle" font-family="Big Shoulders Display,Impact" font-weight="900" font-size="15" fill="#eef3ee">${n?n.id:'?'}</text></svg>`}
 const a=c.c1,b=c.c2,u='cr'+(++_cu),dark=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*.299+((n>>8)&255)*.587+(n&255)*.114)<120};
 const sh='M4 4h32v16c0 9-7 15-16 18C11 35 4 29 4 20z';let pat='';
 if(c.sty===1)pat=`<rect x="4" y="4" width="8" height="36" fill="${b}"/><rect x="20" y="4" width="8" height="36" fill="${b}"/>`;
 else if(c.sty===2)pat=`<rect x="20" y="4" width="16" height="36" fill="${b}"/>`;
 else if(c.sty===3)pat=`<rect x="4" y="4" width="32" height="12" fill="${b}"/>`;
 else if(c.sty===4)pat=`<rect x="4" y="12" width="32" height="6" fill="${b}"/><rect x="4" y="24" width="32" height="6" fill="${b}"/>`;
 else pat=`<path d="M4 28L36 14v8L4 36z" fill="${b}"/>`;
 const tc=dark(a)&&c.sty!==3?'#fff':(c.sty===0||c.sty===3?(dark(a)?'#fff':'#111'):'#111');
 return`<svg class="crest" width="${sz}" height="${sz}" viewBox="0 0 40 40" role="img" aria-label="${esc(c.n)}"><defs><clipPath id="${u}"><path d="${sh}"/></clipPath><linearGradient id="${u}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs><path d="${sh}" fill="${a}"/><g clip-path="url(#${u})">${pat}<rect width="40" height="40" fill="url(#${u}g)"/></g><path d="${sh}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.6"/><text x="20" y="25" text-anchor="middle" font-family="Big Shoulders Display,Impact" font-weight="900" font-size="${c.sg.length>3?9:11.5}" fill="${tc}" stroke="${tc==='#fff'?'#000':'#fff'}" stroke-width=".5" paint-order="stroke">${c.sg}</text></svg>`}
function fileToCrest(file,id,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=160,k=Math.min(1,s/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);CRESTS[id]=cv.toDataURL('image/png');cb(saveCrests())};im.onerror=()=>cb(false);im.src=r.result};r.onerror=()=>cb(false);r.readAsDataURL(file)}
document.addEventListener('change',e=>{const t=e.target;if(t.id==='cr-file'&&t.files[0]){const id=($('#cr-club')||{}).value;fileToCrest(t.files[0],id,ok=>{toast(ok?'Escudo do '+CLUBS[id].n+' atualizado.':'Não foi possível usar essa imagem.',ok?'g':'b');render()})}});

 if(U.screen==='title')a.innerHTML=titleScreen();else if(U.screen==='create')a.innerHTML=createScreen();else if(U.screen==='draft')a.innerHTML=draftScreen();
 else if(U.screen==='auth')a.innerHTML=authScreen();else if(U.screen==='cloud')a.innerHTML=cloudScreen();else if(U.screen==='import')a.innerHTML=importScreen();else if(U.screen==='retro')a.innerHTML=retroScreen();else a.innerHTML=hubScreen()}
function clubTone(id){const c=CLUBS[id],lum=h=>{const n=parseInt(h.slice(1),16);return(n>>16)*.299+((n>>8)&255)*.587+(n&255)*.114};if(!c)return'#2f9e5a';
 if(lum(c.c1)>=70)return c.c1;if(lum(c.c2)>=70&&lum(c.c2)<=210)return c.c2;return shade(c.c1,.45)}
function hubScreen(){const P=G.p,c=CLUBS[G.club],o=curOvr();
 let body;if(U.m)body=matchView();else if(U.tab==='ed')body=`<div class="row"><h2 class="grow">Personalizar personagem</h2><button class="pri" data-a="tab" data-t="pl">Concluir</button></div>${editorHTML()}`;
 else body=({home:homeTab,cal:calTab,tab:tabsTab,pl:playerTab,mk:marketTab,nat:natTab,car:careerTab,sys:sysTab})[U.tab]();
 const anim=U.anim;const out=`<div class="top" style="--club:${clubTone(G.club)}"><div class="row bar-top">${crest(G.club,38)}<div class="grow" style="min-width:0"><div class="disp nm1">${esc(P.name)}</div><div class="xs mute ell">${esc(c.n)} · ${POS[P.pos].n} · ${P.age} anos · ${G.s.lbl}${G.parent?' · emprestado':''}</div></div>
 ${G.inj?`<span class="badge dg">Lesão ${G.inj.left}</span>`:''}<div class="ovrbox"><div class="ovr">${o}</div><div class="xs mute">OVR</div></div></div>
 <div class="nav" role="tablist">${TABS.map(t=>`<button role="tab" class="${!U.m&&(U.tab===t[0]||(U.tab==='ed'&&t[0]==='pl'))?'on':''}" data-a="tab" data-t="${t[0]}">${ico(t[2],16)}<span>${t[1]}</span></button>`).join('')}</div></div><div class="view col ${U.anim?'anim':''}" style="padding-top:12px;--club:${clubTone(G.club)}">${body}</div>`;U.anim=false;return out}
ACTS.tab=(e,d)=>{U.anim=true;U.tab=d.t;U.m=null;render();window.scrollTo(0,0)};

const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
function dateOf(t){const d=new Date(Date.UTC(G.s.y,7,1+Math.round(t*13)));return DIAS[d.getUTCDay()]+', '+String(d.getUTCDate()).padStart(2,'0')+' '+MES[d.getUTCMonth()]}
function upcoming(n){const out=[],cnt={};let tour=false;
 for(let i=G.cur+(G.pend?1:0);i<G.slots.length&&out.length<n;i++){const s=G.slots[i];
  if(s.k==='c'){const c=G.comps[s.c];if(compDone(c))continue;const k=(cnt[s.c]=(cnt[s.c]||0))+0;cnt[s.c]++;
   const kk=k+(G.pend&&G.pend.c===s.c?1:0);let opp=null,home=null,stage='A definir';
   if(c.type==='league'){const m=c.sched[c.r+kk]&&c.sched[c.r+kk].find(p=>p.includes(G.club));if(m){home=m[0]===G.club;opp=home?m[1]:m[0];stage='Rodada '+(c.r+kk+1)+' de '+c.sched.length}}
   else if(c.type==='ko'){if(!c.alive.includes(G.club))continue;stage=KON[c.alive.length>>kk]||'Mata-mata';if(kk>0)stage+=' (se avançar)'}
   else if(c.stage==='g'){const g=c.groups.find(x=>x.ids.includes(G.club));if(c.gr+kk<g.sched.length){const m=g.sched[c.gr+kk].find(p=>p.includes(G.club));home=m[0]===G.club;opp=home?m[1]:m[0];stage=g.name+' · jogo '+(c.gr+kk+1)}else stage='Mata-mata (se classificado)'}
   else{if(!c.ko.alive.includes(G.club))continue;stage=KON[c.ko.alive.length>>kk]||'Mata-mata'}
   out.push({t:s.t,label:c.name,stage,opp,home})}
  else if(s.k==='intl'&&s.n===0&&G.p.age>=18)out.push({t:s.t,label:'Seleção · Data FIFA',stage:G.nat.called?'Convocado: amistoso ou eliminatória':'Se for convocado',nat:true});
  else if(s.k==='tour'&&s.n===0&&!tour){tour=true;out.push({t:s.t,label:s.ty==='WC'?'Copa do Mundo':'Torneio continental',stage:'Se a seleção se classificar',nat:true})}
  else if(s.k==='win')out.push({t:s.t,label:'Janela de transferências',stage:'Propostas de clubes',win:true})}
 return out}
function energyOf(){if(G.inj)return Math.max(10,45-G.inj.left*2);const last=G.res.slice(-3),ld=last.reduce((s,r)=>s+(r.min||0),0)/Math.max(1,last.length);return Math.round(cl(100-ld*.35+(G.train==='rec'?12:0),15,100))}

function homeTab(){const a=advance(),hs=U.hs||'games',st=G.s.st;
 const seg=[['games','Próximos jogos','ball'],['train','Treinar','dumb'],['status','Status','user']];
 const sec=hs==='games'?gamesSec(a):hs==='train'?trainSec():statusSec();

 <div class="hl">Sua carreira,<br><b>${G.s.lbl}</b></div>
 <div class="pills">${[['Jogos',st.j],['Gols',st.g],['Assist.',st.a],['Nota',st.j?f1(st.rs/st.j):'-'],['OVR',curOvr()]].map(x=>`<div class="pill"><span class="pc">${x[1]}</span><span>${x[0]}</span></div>`).join('')}</div></div>
 <div class="seg big" role="tablist">${seg.map(x=>`<button class="${hs===x[0]?'on':''} s-${x[0]}" data-a="hs" data-s="${x[0]}"><span class="ic">${ico(x[2],16)}</span><span>${x[1]}</span></button>`).join('')}</div><div class="view col" key="${hs}">${sec}</div>`}
ACTS.hs=(e,d)=>{U.anim=true;U.hs=d.s;render()};
function fixtureCard(p){const ven=p.neutral?'Campo neutro':(CLUBS[p.h]?CLUBS[p.h].st:'Estádio nacional'),dt=dateOf(G.slots[G.cur].t);
 return`<div class="lime"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="dpill ell" style="max-width:62%">${esc(p.label)}</span><span class="dpill o">${p.inj?'Lesionado':ROLE[p.role]}</span></div>
 <div class="vs2"><div class="tm2"><div class="cc">${crest(p.h,60)}</div><span>${esc(tName(p.h))}</span></div><div class="mid"><span class="xs">${esc(p.stage||'')}</span><span class="big">${dt}</span><span class="xs">${esc(ven)}</span></div><div class="tm2"><div class="cc">${crest(p.a,60)}</div><span>${esc(tName(p.a))}</span></div></div>
 <div class="cta2"><button class="blk" data-a="play">${ico('play',18)} ${p.inj?'Avançar (lesionado)':'Jogar partida'}</button><button class="out" data-a="sim">Simular partida</button><button class="out" data-a="simAll">Até o próximo marco</button></div></div>`}
function dparts(t){const d=dateOf(t).split(', ');return{w:d[0],n:d[1].split(' ')[0]}}
function gamesSec(a){let main='';
 if(a.t==='match')main=fixtureCard(G.pend);
 else if(a.t==='win')main=`<div class="panel hi col"><h3>Janela de transferências</h3><p class="mute sm" style="margin:0">Metade da temporada: clubes enviaram propostas. Acordos fechados agora valem a partir do fim da temporada.</p><div class="row"><button class="play" data-a="tab" data-t="mk">Ver propostas</button><button data-a="closeWin">Fechar janela e continuar</button></div></div>`;
 else if(a.t==='end')main=`<div class="panel hi col"><h3>Fim da temporada ${G.s.lbl}</h3><div class="row"><button class="play" data-a="showSum">Ver resumo da temporada</button><button data-a="tab" data-t="mk">Janela de transferências</button></div></div>`;
 const up=upcoming(7),ts=(G.pend?[G.slots[G.cur].t]:[]).concat(up.map(u=>u.t)).slice(0,8);
 const days=ts.length?`<div class="days">${ts.map((t,i)=>{const d=dparts(t);return`<div class="dchip ${i===0?'on':''}"><span class="xs">${d.w}</span><b class="num">${d.n}</b><i></i></div>`}).join('')}</div>`:'';
 return`<div class="sect"><h3>${a.t==='match'?'Próximo jogo':'Calendário'}</h3><button data-a="tab" data-t="cal">Ver tudo</button></div>${days}${main}
 <div class="sect" style="margin-top:6px"><h3>Depois disso</h3></div>${up.length?up.map(u=>`<div class="ucard">${u.opp?`<div class="cc2">${crest(u.opp,30)}</div>`:`<div class="cc2">${u.win?ico('swap',18):ico('flag',18)}</div>`}<div class="grow" style="min-width:0"><b class="ell" style="display:block">${u.opp?esc(tName(u.opp)):esc(u.label)}</b><span class="xs mute ell" style="display:block;text-transform:none;letter-spacing:0;font-size:12px">${u.opp?esc(u.label)+' · ':''}${esc(u.stage)}</span></div><div class="dt">${dateOf(u.t)}${u.opp?`<br><b style="color:var(--amber)">${u.home?'Casa':'Fora'}</b>`:''}</div></div>`).join(''):'<div class="panel mute sm">Nenhum jogo restante nesta temporada.</div>'}
 <div class="panel sm col"><div class="xs mute">Notícias</div><div class="log">${G.notes.slice(0,5).map(n=>`<p class="${n.k==='g'?'pos':n.k==='b'?'neg':''}">${esc(n.t)}</p>`).join('')||'<span class="mute">Sem notícias.</span>'}</div></div>`}
ACTS.closeWin=()=>{if(G.slots[G.cur]&&G.slots[G.cur].k==='win'){G.cur++;G.win=null}render()};
/* ===== Treinar ===== */
function matchesLeft(){return G.slots.slice(G.cur).filter(s=>s.k==='c'&&G.comps[s.c]&&!compDone(G.comps[s.c])).length}
function trainSec(){const left=matchesLeft(),P=G.p;
 const cards=Object.keys(TRAIN).map(k=>{const sel=G.train===k;if(k==='rec')return`<div class="trc ${sel?'on':''}"><div class="row"><span class="tic">${ico('heal',20)}</span><b class="grow">Recuperação</b>${sel?'<span class="badge tl">Ativo</span>':''}</div><div class="sm mute">Lesões curam duas vezes mais rápido e o risco de nova lesão cai cerca de 30%. Aumenta a energia.</div><div class="kv"><span>Sem ganho de atributo</span><b>Energia +12</b></div><button class="train" data-a="train" data-k="rec" ${sel?'disabled':''}>${sel?'Foco atual':'Definir foco'}</button></div>`;
  const r=trainRate(k),pr=G.prog[k],proj=Math.floor(pr+r*left);
  return`<div class="trc ${sel?'on':''}"><div class="row"><span class="tic">${ico('bolt',20)}</span><b class="grow">${ATTR[k]}</b><span class="num disp" style="font-size:28px">${P.attrs[k]}</span></div>${bar(pr*100,'var(--teal)')}<div class="xs mute">Progresso até o próximo ponto: ${Math.round(pr*100)}%</div>
  <div class="kv"><span>Ganho por sessão</span><b class="num">+${(r).toFixed(2)}</b></div><div class="kv"><span>Até o fim da temporada</span><b class="num">${proj>0?'+'+proj+' pts':'menos de 1 pt'}</b></div>${sel&&G.lastGain?`<div class="kv"><span>Última sessão</span><b class="num pos">+${G.lastGain.toFixed(2)}</b></div>`:''}
  <button class="train" data-a="train" data-k="${k}" ${sel?'disabled':''}>${sel?'Foco atual':'Treinar este atributo'}</button></div>`}).join('');
 return`<div class="panel tpanel col"><div class="row">${avFull(P.av,G.club,86,'train')}<div class="grow col" style="gap:6px"><h3>Centro de treinamento</h3><div class="sm mute">Cada partida conta como uma sessão. O foco escolhido ganha progresso depois de cada jogo, mais rápido quando você é jovem e ainda tem potencial a desenvolver.</div><div class="row"><span class="badge tl">Foco: ${TRAIN[G.train]}</span><span class="badge">${left} sessões restantes</span></div></div></div></div>
 <div class="panel col"><div class="row"><b class="grow">Pontos de treino</b><span class="disp num" style="font-size:30px;color:var(--teal)">${G.tp}</span></div>${bar(G.xp/XPT*100,'var(--teal)')}<div class="xs mute">XP ${G.xp}/${XPT} para o próximo ponto (cada jogo rende XP)</div>${G.tp>0?`<div class="row" style="gap:6px">${AK.map(a=>`<button class="train" data-a="tp" data-k="${a}" style="padding:6px 10px;min-height:34px">+1 ${ATTR[a]}</button>`).join('')}</div>`:''}</div>
 <div class="grid g2">${cards}</div>`}

function statusSec(){const P=G.p,o=curOvr(),a0=G.s.a0||P.attrs,en=energyOf(),val=mktValue(o,P.age,P.pot);
 return`<div class="grid g2"><div class="panel col"><div class="row" style="flex-wrap:nowrap;gap:14px"><div>${avFull(P.av,G.club,110)}</div><div class="grow col" style="gap:6px"><div class="ovr">${o}</div><div class="sm mute">${rankLabel(o)} · potencial ${P.pot}</div><div class="badge" style="align-self:flex-start">${POS[P.pos].n}</div>${G.inj?`<div class="sm neg">${G.inj.n} · ${G.inj.left} jogos</div>`:''}<button data-a="edOpen" style="align-self:flex-start;padding:6px 10px;min-height:34px">Personalizar</button></div></div>
 ${AK.map(k=>{const d=P.attrs[k]-(a0[k]||P.attrs[k]);return`<div class="attr"><span>${ATTR[k]}</span>${bar(P.attrs[k],P.attrs[k]>=85?'var(--amber)':'')}<span class="num"><b>${P.attrs[k]}</b>${d?`<small class="${d>0?'pos':'neg'}"> ${d>0?'+':''}${d}</small>`:''}</span></div>`}).join('')}<div class="xs mute">Os números pequenos mostram a evolução na temporada.</div></div>
 <div class="col"><div class="panel col"><div class="xs mute">Condição</div>${[['Energia',en,en<40?'var(--red)':'var(--teal)'],['Forma',G.form,''],['Treinador',G.coach,''],['Torcida',G.fan,''],['Reputação',G.rep,'var(--amber)']].map(x=>`<div class="attr" style="grid-template-columns:90px 1fr 34px"><span class="sm">${x[0]}</span>${bar(x[1],x[2])}<span class="num sm">${Math.round(x[1])}</span></div>`).join('')}<div class="xs mute">Energia reflete a carga dos últimos jogos e o foco em recuperação. É só um indicador.</div></div>
 <div class="panel"><div class="kv"><span>Valor de mercado</span><b>${money(val)}</b></div><div class="kv"><span>Contrato</span><b>${G.ct.yrs>0?G.ct.yrs+' ano(s)':'Expirando'} · ${money(G.ct.sal)}/ano</b></div><div class="kv"><span>Papel no clube</span><b>${ROLE[roleFor(strAny(G.club),G.comps.base?-15:0)]}</b></div><div class="kv"><span>XP</span><b>${G.xp}/${XPT} · ${G.tp} TP</b></div></div></div></div>
 <div class="grid g3">${P.talents.map(t=>`<div class="tcard r-${t.r}"><div class="rar">${RAR[t.r].n}</div><div class="nm" style="font-size:20px">${esc(t.n)}</div><div class="sm mute">${ATTR[t.a]}</div></div>`).join('')}</div>`}

U.au={mode:'in',busy:false,msg:'',ok:false};
function authScreen(){const a=U.au,up=a.mode==='up';
 return`<div class="hero col" style="gap:18px;max-width:460px;margin-inline:auto"><div class="xs mute">Simulador de carreira</div><h1>Da base<br><b>à lenda.</b></h1>
 <div class="seg"><button class="${up?'':'on'}" data-a="auMode" data-m="in">Entrar</button><button class="${up?'on':''}" data-a="auMode" data-m="up">Criar conta</button></div>
 <div class="panel col" style="gap:10px"><label class="sm mute" for="au-email">E-mail</label><input id="au-email" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" value="${esc(a.email||'')}">
 <label class="sm mute" for="au-pw">Senha</label><input id="au-pw" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="${up?'Mínimo de 6 caracteres':'Sua senha'}">

 <button class="pri" data-a="auGo" ${a.busy?'disabled':''}>${a.busy?'Aguarde…':up?'Criar conta':'Entrar'}</button></div>
 <p class="xs mute" style="margin:0">Suas carreiras ficam salvas na sua conta e você pode continuar de qualquer aparelho. A senha é guardada de forma criptografada pelo serviço de autenticação; o jogo nunca a vê depois do envio.</p>
 <div><button data-a="auGuest">Jogar sem conta</button></div></div>`}
ACTS.auMode=(e,d)=>{U.au.mode=d.m;U.au.msg='';render()};
ACTS.auGuest=()=>{lsSet(GUESTK,'1');U.screen='title';render()};
ACTS.auGo=async()=>{const a=U.au;if(a.busy)return;
 const email=($('#au-email').value||'').trim(),pw=$('#au-pw').value||'';a.email=email;
 if(!/^\S+@\S+\.\S+$/.test(email)){a.msg='Digite um e-mail válido.';a.ok=false;render();return}
 if(pw.length<6){a.msg='A senha precisa ter pelo menos 6 caracteres.';a.ok=false;render();return}
 a.busy=true;a.msg='';render();
 try{const r=a.mode==='up'?await cloudSignup(email,pw):await cloudLogin(email,pw);
  a.busy=false;
  if(r==='confirm'){a.mode='in';a.ok=true;a.msg='Conta criada! Confirme seu e-mail pelo link que enviamos e depois entre.';render();return}
  U.screen='title';render();toast('Bem-vindo, '+CLOUD.user.email,'g')}
 catch(e){a.busy=false;a.ok=false;a.msg=authMsg(e);render()}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&U.screen==='auth'&&e.target.closest&&e.target.closest('#au-email,#au-pw'))ACTS.auGo()});
ACTS.auOut=()=>{cloudLogout();G=null;U.screen='auth';U.au.msg='';U.au.ok=false;U.m=null;closeModal();render()};
ACTS.toLogin=()=>{U.screen='auth';render()};

 return`<div class="panel col"><h3>Conta</h3><div class="sm">${esc(CLOUD.user.email)}</div><div class="sm mute">${st}</div><div class="row"><button class="pri" data-a="cpush">Enviar para a nuvem agora</button><button data-a="clOpen">Minhas carreiras</button><button data-a="auOut">Sair</button></div></div>`}
ACTS.cpush=async()=>{CLOUD.sync='busy';render();const ok=await cloudPush();toast(ok?'Carreira enviada para a nuvem.':'Não foi possível enviar: '+CLOUD.err,ok?'g':'b')};

/* ===== CARREIRA ===== */
function careerTab(){const K=G.car,t={};for(const x of G.trophies)t[x.k]=(t[x.k]||0)+1;
 const TN={lg:'Campeonato nacional',cup:'Copa nacional',cont:'Libertadores / Champions',est:'Estadual',base:'Base',wc:'Copa do Mundo',natcont:'Torneio continental'};
 return`<div class="grid g3">${[['Jogos',K.j],['Gols',K.g],['Assistências',K.a],['Troféus',G.trophies.length],['Prêmios',G.awards.length],['Overall máx.',K.peak]].map(x=>`<div class="panel"><div class="disp num" style="font-size:34px">${x[1]}</div><div class="xs mute">${x[0]}</div></div>`).join('')}</div>
 <div class="panel tw"><div class="xs mute" style="margin-bottom:6px">Temporadas</div><table><tr><th>Ano</th><th class="l">Clube</th><th>Idade</th><th>OVR</th><th>J</th><th>G</th><th>A</th><th>Nota</th><th class="l">Conquistas</th></tr>
 ${G.hist.map(h=>`<tr><td>${h.y}</td><td class="l">${esc(h.club)}</td><td class="num">${h.age}</td><td class="num">${h.ovr}</td><td class="num">${h.j}</td><td class="num">${h.g}</td><td class="num">${h.a}</td><td class="num">${h.j?h.avg.toFixed(2):'-'}</td><td class="l sm">${esc(h.tit.concat(h.aw).join(', '))}</td></tr>`).join('')||'<tr><td colspan="9" class="mute">A primeira temporada ainda não terminou.</td></tr>'}</table></div>
 <div class="grid g2"><div class="panel"><div class="xs mute" style="margin-bottom:6px">Títulos</div>${Object.keys(t).map(k=>`<div class="kv"><span>${TN[k]||k}</span><b>${t[k]}</b></div>`).join('')||'<span class="mute sm">Nenhum ainda.</span>'}</div>
 <div class="panel"><div class="xs mute" style="margin-bottom:6px">Prêmios individuais</div>${G.awards.map(a=>`<div class="kv"><span>${esc(a.n)}</span><b>${a.y}</b></div>`).join('')||'<span class="mute sm">Nenhum ainda.</span>'}</div></div>
 <div class="panel"><div class="xs mute" style="margin-bottom:6px">Recordes pessoais</div><div class="kv"><span>Mais gols em um jogo</span><b>${G.rec.mg}</b></div><div class="kv"><span>Mais gols em uma temporada</span><b>${G.rec.sg}</b></div><div class="kv"><span>Melhor nota</span><b>${G.rec.rt||'-'}</b></div><div class="kv"><span>Maior transferência</span><b>${G.rec.fee?money(G.rec.fee):'-'}</b></div></div>
 <div class="panel"><div class="xs mute" style="margin-bottom:8px">Conquistas ${Object.keys(G.ach).length}/${ACH.length}</div><div class="grid g3">${ACH.map(a=>{const on=G.ach[a[0]];return`<div class="panel sm" style="${on?'border-color:var(--amber)':'opacity:.55'}"><b>${on?'★ ':''}${a[1]}</b><div class="mute xs" style="text-transform:none;letter-spacing:0">${a[2]}</div></div>`}).join('')}</div></div>
 ${G.p.age>=31?`<button class="dan" data-a="retAsk">Encerrar carreira</button>`:'<div class="sm mute">A aposentadoria pode ser decidida a partir dos 31 anos.</div>'}`}
ACTS.retAsk=()=>showModal(`<h2>Encerrar a carreira?</h2><p>Você terá a retrospectiva completa e a classificação histórica. Essa decisão não pode ser desfeita.</p><div class="row"><button class="dan" data-a="retire">Sim, me aposentar</button><button data-a="closeM2">Continuar jogando</button></div>`);
ACTS.closeM2=()=>closeModal();
ACTS.retire=()=>{closeModal();if(!G.sum)G.car.peak=Math.max(G.car.peak,curOvr());G.retired=true;G.legacy=legacyOf();save();U.screen='retro';U.m=null;render();window.scrollTo(0,0)};
function retroScreen(){const L=G.legacy||legacyOf(),K=G.car,P=G.p,t=L.t,N=NATS[P.nat];
 const TN={lg:'Campeonatos nacionais',cup:'Copas nacionais',cont:'Libertadores / Champions',est:'Estaduais',wc:'Copas do Mundo',natcont:'Torneios continentais'};
 return`<div class="hero col"><div class="xs mute">Retrospectiva</div><h1>${esc(P.name)}</h1><div class="row">${avatar(P.av,72,G.club)}<div><div class="disp" style="font-size:34px;color:var(--amber)">${L.tier}</div><div class="mute">${flag(P.nat)} ${N.n} · ${G.hist.length} temporadas · ${G.hist[0]?G.hist[0].y.slice(0,4):''} a ${G.s.y}</div></div></div>
 <div class="grid g3">${[['Overall máximo',K.peak],['Partidas',K.j],['Gols',K.g],['Assistências',K.a],['Jogos pela seleção',G.nat.caps],['Copas do Mundo',G.nat.wc.length],['Pontos de legado',L.pts],['Bolas de Ouro',L.bd],['Ganhos totais',money(K.earn)]].map(x=>`<div class="panel"><div class="disp num" style="font-size:34px">${x[1]}</div><div class="xs mute">${x[0]}</div></div>`).join('')}</div>
 <div class="grid g2"><div class="panel"><div class="xs mute" style="margin-bottom:6px">Títulos</div>${Object.keys(TN).map(k=>t[k]?`<div class="kv"><span>${TN[k]}</span><b>${t[k]}</b></div>`:'').join('')||'<span class="mute sm">Nenhum título.</span>'}${G.nat.titles.length?`<div class="sm pos" style="margin-top:6px">${G.nat.titles.join(', ')}</div>`:''}</div>
 <div class="panel"><div class="xs mute" style="margin-bottom:6px">Prêmios individuais</div>${G.awards.map(a=>`<div class="kv"><span>${esc(a.n)}</span><b>${a.y}</b></div>`).join('')||'<span class="mute sm">Nenhum.</span>'}</div>
 <div class="panel"><div class="xs mute" style="margin-bottom:6px">Clubes defendidos</div>${G.clubs.map(c=>`<div class="kv"><span class="row" style="gap:6px;flex-wrap:nowrap">${crest(c.id,20)}${esc(CLUBS[c.id].n)}${c.loan?' (emp.)':''}</span><b class="num">${c.from}${c.to?' a '+c.to:'+'} anos</b></div>`).join('')}</div>
 <div class="panel"><div class="xs mute" style="margin-bottom:6px">Transferências · total ${money(K.fees)}</div>${G.xfers.map(x=>`<div class="kv"><span>${esc(CLUBS[x.to].n)} (${x.y})</span><b>${x.fee?money(x.fee):OT[x.type]}</b></div>`).join('')||'<span class="mute sm">Nenhuma transferência.</span>'}</div></div>
 <div class="panel"><div class="xs mute" style="margin-bottom:6px">Recordes e conquistas históricas</div><div class="row" style="gap:6px">${ACH.filter(a=>G.ach[a[0]]).map(a=>`<span class="badge" style="color:var(--amber);border-color:var(--amber)">${a[1]}</span>`).join('')||'<span class="mute sm">Nenhuma.</span>'}</div><div class="sm mute" style="margin-top:8px">Mais gols em um jogo: ${G.rec.mg} · em uma temporada: ${G.rec.sg} · maior transferência: ${G.rec.fee?money(G.rec.fee):'-'}</div></div>
 <div class="row"><button class="pri" data-a="newAfter">Nova carreira</button><button data-a="title">Menu inicial</button></div></div>`}
ACTS.newAfter=()=>{deleteSave();U.form=null;U.screen='create';ACTS.new()};
/* ===== SISTEMA ===== */
function sysTab(){return acctPanel()+`<div class="panel col"><h3>Save</h3><p class="mute sm" style="margin:0">O progresso é salvo automaticamente neste navegador após cada partida. Para guardar em outro lugar, exporte o código.</p>
 <div class="row"><button class="pri" data-a="saveNow">Salvar agora</button><button data-a="exp">Exportar código</button></div><textarea id="exptxt" readonly placeholder="O código exportado aparece aqui" style="display:${U.exp?'block':'none'}">${U.exp||''}</textarea>
 <div id="cpw" ${U.exp?'':'hidden'}><button data-a="cpy">Copiar código</button></div></div>
 <div class="panel col"><h3>Importar</h3><textarea id="imp" placeholder="Cole o código aqui"></textarea><div><button data-a="doImp">Carregar save</button></div></div>
 <div class="panel col"><h3>Escudos dos clubes</h3><p class="mute sm" style="margin:0">Os escudos oficiais são marcas registradas e não vêm embutidos no jogo. Envie a imagem de um clube (PNG ou JPG) e ela passa a aparecer em todas as telas. Fica salva neste navegador.</p><div class="row"><select id="cr-club" style="max-width:260px">${PLAYABLE.map(c=>`<option value="${c.id}">${esc(c.n)}${CRESTS[c.id]?' (personalizado)':''}</option>`).join('')}</select><input id="cr-file" type="file" accept="image/*" style="max-width:260px"></div><div class="row"><button data-a="crReset">Voltar ao escudo padrão deste clube</button><button class="dan" data-a="crAll">Remover todos</button></div></div>
 <div class="panel col"><h3>Nova carreira</h3><div class="row"><button class="dan" data-a="newConf">Abandonar esta carreira</button></div></div>`}
ACTS.saveNow=()=>toast(save()?'Carreira salva.':'Não foi possível salvar neste navegador. Use Exportar.',save()?'g':'b');
ACTS.exp=()=>{U.exp=exportSave();render()};
ACTS.cpy=()=>{const t=$('#exptxt');t.select();(navigator.clipboard?navigator.clipboard.writeText(U.exp):Promise.reject()).then(()=>toast('Código copiado.','g')).catch(()=>toast('Selecione o texto e copie manualmente.'))};
ACTS.newConf=()=>showModal(`<h2>Abandonar a carreira?</h2><p>O progresso atual será perdido, a menos que você tenha exportado o código.</p><div class="row"><button class="dan" data-a="newGo">Abandonar e criar outra</button><button data-a="closeM2">Cancelar</button></div>`);
ACTS.newGo=()=>{closeModal();deleteSave();U.form=null;U.exp=null;ACTS.new()};
/* ===== BOOT ===== */
function boot(){if(restoreSession()||lsGet(GUESTK))U.screen='title';else U.screen='auth';render();if(CLOUD.user)ensureFresh().catch(()=>{if(!CLOUD.user){U.screen='auth';render()}})}
boot();

</script>
</body></html>
